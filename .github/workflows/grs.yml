name: Update README cards

on:
  schedule:
    - cron: "17 6 * * *" # daily
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/grs.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Add a PAT (repo + read:user scopes) as the GRS_TOKEN secret to include private contributions.
      CARD_TOKEN: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=transparent&show_icons=true&include_all_commits=true&count_private=true&hide_rank=false&custom_title=statistics&line_height=24&hide_title=true&text_bold=true&card_width=420&ring_color=f34b7d&text_color=007ec4&icon_color=f34b7d&border_color=69b7df
          path: profile/stats.svg
          token: ${{ env.CARD_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=transparent&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&hide_title=true&text_bold=true&card_width=360&text_color=007ec4&border_color=69b7df
          path: profile/top-langs.svg
          token: ${{ env.CARD_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
